name: codechenx-tv
 
version: '0.9.1'
title: Fast Table Viewer
summary: Fast table viewer for delimited file in terminal.
description: |
    A fast, feature-rich CSV/TSV/delimited file viewer for the command line.
license: Apache-2.0
contact: codechenx@gmail.com
issues: https://github.com/codechenx/FastTableViewer/issues
source-code: https://github.com/codechenx/FastTableViewer
website: https://github.com/codechenx/FastTableViewer
base: core24
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

parts:
  woke:
    plugin: go
    build-snaps: [go/latest/stable]
    source: https://github.com/codechenx/FastTableViewer.git
    source-type: git

apps:
  codechenx-tv:
    command: bin/ftv
    plugs:
      - home
      - removable-media
