name: golangci-lint
on: [push, pull_request]
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        # Pin the linter rather than tracking "latest". The action's own
        # "latest" resolved to golangci-lint 1.64.8, which cannot read the
        # export data of a Go 1.24+ standard library, so every run failed
        # typechecking with "export data version 4 is greater than maximum
        # supported version 2" and reported every stdlib import as unresolved.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
