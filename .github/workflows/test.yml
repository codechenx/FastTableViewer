name: test
on: [push, pull_request]
jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod declares go 1.24.0, so these are the releases that can
        # actually build it. The matrix used to name 1.21-1.23 as well, and
        # those jobs passed only because setup-go@v5 let the toolchain
        # silently download 1.24 and test on that instead; @v6 pins
        # GOTOOLCHAIN=local, which turned the pretence into a hard failure.
        go: ['1.24', '1.25']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go test -v -race -coverprofile=profile.cov ./...

      # Coverage reporting must not decide whether the code is good: the
      # upload is a third-party service call, so a bad day there is not a
      # broken build.
      - name: Send coverage
        continue-on-error: true
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: profile.cov
          flag-name: Go-${{ matrix.go }}
          parallel: true

  # notifies that all test jobs are finished.
  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # The per-job uploads succeed, but this aggregation step reports "No
      # build matching CI build number <run id> found" because it looks the
      # build up by a different number than the uploads registered under.
      # That failed the whole workflow while every test job passed.
      - uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          parallel-finished: true
